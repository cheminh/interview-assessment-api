apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.namespace }}
  # Creates an internal load balancer that is only accessible within your Azure Virtual Network (VNet)
  # No public IP address is assigned to the service
  # Traffic stays within your private network
  # annotations:
  #  service.beta.kubernetes.io/azure-load-balancer-internal: 'true'
spec:
  type: ClusterIP # change to use cluster IP instead of internal LB, LoadBalancer
  selector:
    app: {{ .Chart.Name }}
  ports:
    - protocol: TCP
      port: 4000
      targetPort: {{ .Values.PORT }}
