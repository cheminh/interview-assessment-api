apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Chart.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
      annotations:
        ### annotations for Devo - start 
        ### reference: https://manulife-ets.atlassian.net/wiki/spaces/PH/pages/6378622621/Azure+AKS+Container+stdout+-+App+Logs#AzureAKSContainerstdout-AppLogs-PodConfigurationMetadata
        mfc_ver: "1.1"
        app_name: "{{ .Chart.Name }}"   # any string denoting your app's name
        app_comp: "{{ .Chart.Name }}"   # any string denoting your component's name
        env: {{ .Values.environment }}          # dev | test | uat | prod
        asi_ci_num: {{ .Values.ciNumber }}      # the CI number for the application
        app_ci_num: {{ .Values.appCiNumber }}   # the CI number for the app component
        cost_center: "0000"                     # the cost center for the team
        owning_segment: ets                     # ets | can | us | asia | gf | gwam
        sec_flag: "false"                       # if true, logs have security details but does not have the ability to specify this at the event level
        pii_flag: "false"                       # if true, logs have pii content but does not have the ability to specify this at the event level
        ### annotations for Devo - end 
    spec:
      nodeSelector:
        'kubernetes.io/os': linux
      containers:
        - name: {{ .Chart.Name }}
          image: {{ .Values.imageRegistry }}/{{ .Chart.Name }}:{{ .Values.apiDockerTag }}
          imagePullPolicy: Always
          env:
            - name: NEW_RELIC_APP_NAME
              value: "acordvi-mu-aks-a-api"
            - name: NEW_RELIC_LABELS
              value: "AppDetail:MUAKSA;BU:MU-AKS-A;Region:DEV;Division:ETS"
            - name: NEW_RELIC_DISTRIBUTED_TRACING_ENABLED
              value: "true"
            - name: NEW_RELIC_LICENSE_KEY
              value: new-relic-license-key@azurekeyvault
            - name: NEW_RELIC_NO_CONFIG_FILE
              value: "true"
            - name: NEW_RELIC_LOG_ENABLED
              value: "false"
          resources:
            limits:
              memory: '512Mi'
              cpu: '100m'
          # volumeMounts:
          #   - name: config-file-sec
          #     mountPath: '/usr/src/config/'
          ports:
            - containerPort: {{ .Values.PORT }}
          # Add in this lifecycle command to create a symlink to the config
          # file in src/utils/config.json
      #     lifecycle:
      #       postStart:
      #         exec:
      #           command:
      #             - /bin/sh
      #             - -c
      #             - rm -rf ./src/config.json && ln -s /usr/src/config/config-sec.json ./src/config.json
      # volumes:
      #   - name: config-file-sec
      #     secret:
      #       secretName: config-sec.json
